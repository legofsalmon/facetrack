name: build installers

# Builds unsigned app bundles for both platforms. Signing and
# notarisation need paid certificates and are done locally for now —
# see build/README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to stamp into the build"
        required: false
        default: "0.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"      # Syphon needs 3.12
            artefact: Yewee-macos
          - os: windows-latest
            python: "3.13"      # Spout supports up to 3.13
            artefact: Yewee-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Smoke tests
        run: python -m tests.smoke

      - name: Work out the version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      # Always --distribution. Falling back to an internal build produced
      # artefacts with licensing switched off that also carried RVM, which is
      # GPL-3.0 and must not ship in a paid product — a quietly downgraded
      # build is far worse than a failed one. build/build.py defaults to the
      # vendor public key held in the repo; the secret only overrides it.
      - name: Build
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${{ secrets.YEWEE_PUBKEY }}" ]; then
            EXTRA="--pubkey ${{ secrets.YEWEE_PUBKEY }}"
          fi
          python build/build.py --distribution --version "$VERSION" $EXTRA

      - name: Check the bundle
        shell: bash
        run: |
          test -d build/dist || { echo "nothing was built"; exit 1; }
          du -sh build/dist/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}-${{ env.VERSION }}
          path: build/dist/
          retention-days: 14
