name: build installers

# Builds unsigned app bundles for both platforms. Signing and
# notarisation need paid certificates and are done locally for now —
# see build/README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to stamp into the build"
        required: false
        default: "0.0.0"

# The release step needs to write releases; everything else only reads.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"      # Syphon needs 3.12
            artefact: Yewee-macos
          - os: windows-latest
            python: "3.13"      # Spout supports up to 3.13
            artefact: Yewee-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Smoke tests
        run: python -m tests.smoke

      - name: Work out the version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      # YEWEE_PUBKEY is the licence public key from the Licence Admin.
      # Without it this produces an internal (unlicensed) build, which is
      # what you want for testing but not for release.
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ secrets.YEWEE_PUBKEY }}" ]; then
            python build/build.py --distribution \
              --pubkey "${{ secrets.YEWEE_PUBKEY }}" --version "$VERSION"
          else
            echo "::warning::No YEWEE_PUBKEY secret — building an internal, unlicensed app"
            python build/build.py --version "$VERSION"
          fi

      - name: Check the bundle
        shell: bash
        run: |
          test -d build/dist || { echo "nothing was built"; exit 1; }
          du -sh build/dist/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}-${{ env.VERSION }}
          path: build/dist/
          retention-days: 14

      # A release is the easy download: repo front page → Releases.
      # Tag builds attach to their tag's release; manual runs go to a
      # rolling "build-latest" prerelease whose assets get replaced.
      # ditto (not zip) on macOS so the .app keeps its symlinks and
      # executable bits — a plain zip unpacks broken.
      - name: Zip for the release
        shell: bash
        run: |
          cd build/dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --keepParent Yewee.app "../../${{ matrix.artefact }}-${VERSION}.zip"
          else
            7z a "../../${{ matrix.artefact }}-${VERSION}.zip" yewee
          fi

      - name: Publish to a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "$TAG" --title "yewee $VERSION" \
              --notes "Unsigned build — signing is done locally, see build/README.md." || true
          else
            TAG="build-latest"
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Rolling unsigned build from the most recent manual run." || true
          fi
          gh release upload "$TAG" "${{ matrix.artefact }}-${VERSION}.zip" --clobber
