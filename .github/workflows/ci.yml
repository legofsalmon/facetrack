name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # The full file, not a hand-picked subset. This job used to install
      # numpy and opencv only, so cyndilib, fastapi, uvicorn, websockets
      # and onnxruntime were all absent: every NDI and ONNX test skipped
      # on every pull request, and yewee/webui.py was never imported by
      # anything at all. A broken import there passed CI clean and would
      # first appear in build.yml at tag time, or on a customer's machine.
      # It costs about a minute.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cheap and direct: every module has to at least import. The smoke
      # suite exercises most of them, but the panel is only reachable by
      # running the app, so it needs saying explicitly.
      - name: Every module imports
        run: |
          python -c "import main, yewee.webui, yewee.ndi_io, yewee.doctor, \
                            yewee.licensing, yewee.segmenter, yewee.emotion, \
                            yewee.texture_out, tests.idbench"

      - name: Smoke tests
        run: python -m tests.smoke
